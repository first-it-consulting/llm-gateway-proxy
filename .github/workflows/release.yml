name: Release

# Pushing a tag like "v1.0.0" builds and publishes the container image to GHCR
# and creates a matching GitHub Release, with its body pulled straight from
# that version's section in CHANGELOG.md. The changelog entry itself is written
# by hand as part of preparing the release (see "Releasing a new version" in
# README.md) -- this workflow automates the build and the Release, not the notes.
#
# Image: ghcr.io/first-it-consulting/llm-gateway-proxy:<version> and :latest,
# multi-arch (linux/amd64 + linux/arm64).
#
# Auth uses the run's built-in GITHUB_TOKEN, not a stored PAT: it expires when
# the run ends and the packages:write permission above is all it can do, so
# there is no standing credential to rotate or leak. Two prerequisites, both
# one-time and both set in the repo's web UI (the API cannot do them):
#
#   1. The ghcr.io package must exist before its first push. Create it at
#      https://github.com/first-it-consulting?tab=packages -> "New package" ->
#      name "llm-gateway-proxy", visibility "Public" (so anyone can pull from
#      this public repo without a login), linked to this repository. Without
#      it the first push fails with a permission denied.
#   2. Nothing else. The repo's Actions "Workflow permissions" default can
#      stay "Read-only": a permissions: block in this workflow overrides it,
#      so the packages: write declared above is what the token gets.
#
# Who can publish, and what the publish token can reach. An environment with a
# required reviewer would gate this behind an approval, and that is what was
# here originally, but it was removed: this repo has exactly one account, so the
# required reviewer is the same identity that pushes the tag, and the approval
# cannot be granted through the API (the deployment-approval endpoint is not
# exposed to a personal-access token). Every release would then stall until
# someone opened the run page and clicked "Review deployments". If you ever want
# that gate back -- and it is a real improvement, it stops a stray or hostile
# tag push from publishing -- create a "release" environment with yourself as
# required reviewer and add `environment: release` to both jobs, and budget the
# click on every release.
#
# What stands in for it instead: the trigger is a tag push, main is protected so
# history cannot be rewritten under a tag, and tags are not protected (tag
# protection rules are an org/enterprise feature and this is a user-owned repo),
# so anyone with push access can trigger a publish.
#
# Reach of the publish token: packages:write is repository-scoped, not
# package-scoped -- the run can push to ANY package belonging to this
# repository, not just llm-gateway-proxy, and contents:write lets it move tags.
# It dies when the job ends.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  container-image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    # Belt and braces: this workflow only triggers on a v*.*.* tag push, which
    # a fork cannot produce, so pull_request_request_target-style abuse is not
    # reachable. Kept so a future "workflow_dispatch"/pull trigger addition
    # cannot quietly make the publishing job run on untrusted input.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive image name and tags from the git tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # This workflow only ever runs on a v*.*.* tag, so `latest` is
          # unconditional here -- is_default_branch would never be true.
          # Prereleases (v1.2.0-rc1) get their exact tag but not `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Login to GHCR
        # github.token, not a stored secret: short-lived, scoped to this run,
        # and limited to the packages:write grant declared above.
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Strip leading "v" from the tag to match CHANGELOG.md headings
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ steps.version.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          prerelease: ${{ steps.changelog.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog.outputs.status == 'unreleased' }}
