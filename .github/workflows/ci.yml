name: CI

# Runs the unit test suite on every pull request and on every push to main.
# The `test` job is the required status check for the protected main branch
# (see "Releasing a new version" in README.md), so a PR cannot merge unless it
# passes on both the oldest and the newest supported Python.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is this project's requires-python floor, 3.12 the newest version
        # it declares support for; both get tested so a syntax or stdlib
        # regression against the floor is caught here.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        # tests/ also holds smoke_test.py, a manual script that needs a live
        # server and real credentials -- it is deliberately not collected here.
        run: python -m pytest tests/test_upstream_routing.py -v
