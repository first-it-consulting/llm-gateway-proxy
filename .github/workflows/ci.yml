name: CI

# Runs the unit test suite on every pull request and on every push to main.
# The `test` job is the required status check for the protected main branch
# (see "Releasing a new version" in README.md), so a PR cannot merge unless it
# passes on every matrix entry.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is pyproject's requires-python floor and the lowest Python
        # GitHub can still provision on current runners; 3.12 is what the
        # Dockerfile ships (python:3.12-slim), so it is the version that
        # actually runs in production.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # v7, not v5: ubuntu-latest moved to Ubuntu 26.04, and older
      # setup-python releases cannot resolve interpreter versions there.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        # tests/ also holds smoke_test.py, a manual script that needs a live
        # server and real credentials -- it is deliberately not collected here.
        run: python -m pytest tests/test_upstream_routing.py -v
